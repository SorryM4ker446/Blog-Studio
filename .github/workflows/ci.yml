name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_DSN: host=127.0.0.1 user=postgres password=postgres dbname=blog_db_test port=5432 sslmode=disable TimeZone=UTC
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          source /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Apply database migrations
        env:
          DB_DSN: ${{ env.TEST_DB_DSN }}
        run: go run ./cmd/migrate up
      - run: go test -race -p 1 ./...
      - name: Record anonymous public read benchmark
        run: |
          set -o pipefail
          go test -run '^$' -bench '^BenchmarkAnonymousPublicReads$' -benchmem -benchtime=200ms -count=1 ./internal/routes | tee "$RUNNER_TEMP/public-read-benchmark.txt"
      - name: Upload public read benchmark
        uses: actions/upload-artifact@v4
        with:
          name: public-read-benchmark
          path: ${{ runner.temp }}/public-read-benchmark.txt
          retention-days: 30
      - run: go build ./...

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_DSN: host=127.0.0.1 user=postgres password=postgres dbname=blog_db_test port=5432 sslmode=disable TimeZone=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    env:
      SITE_ADDRESS: :80
      SITE_ORIGIN: http://127.0.0.1:18000
      APP_IMAGE_TAG: ci
      APP_NETWORK_SUBNET: 172.30.0.0/24
      APP_NETWORK_IP_RANGE: 172.30.0.128/25
      CADDY_TRUSTED_IP: 172.30.0.2
      HTTP_PORT: "18000"
      HTTPS_PORT: "18443"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable Compose secrets
        run: |
          mkdir -p deploy/secrets deploy/backups
          printf '%s' 'ci-postgres-password' > deploy/secrets/postgres_password
          printf '%s' 'ci-jwt-secret-with-at-least-thirty-two-bytes' > deploy/secrets/jwt_secret
          printf '%s' 'ci-admin-password-strong-value' > deploy/secrets/admin_password
      - name: Validate Compose configuration
        run: |
          docker compose --profile tools config --quiet
          docker compose --profile tools config --format json > "$RUNNER_TEMP/compose-config.json"
          python3 - "$RUNNER_TEMP/compose-config.json" <<'PY'
          import ipaddress
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as config_file:
              config = json.load(config_file)

          network_config = config["networks"]["app"]["ipam"]["config"]
          if len(network_config) != 1:
              raise SystemExit("the app network must define exactly one IPAM range")

          subnet = ipaddress.ip_network(network_config[0]["subnet"])
          dynamic_range = ipaddress.ip_network(network_config[0]["ip_range"])
          caddy_address = ipaddress.ip_address(
              config["services"]["caddy"]["networks"]["app"]["ipv4_address"]
          )
          trusted_proxy = config["services"]["backend"]["environment"]["TRUSTED_PROXIES"]

          if not dynamic_range.subnet_of(subnet):
              raise SystemExit("the dynamic address range must be contained by the app subnet")
          if caddy_address not in subnet:
              raise SystemExit("the Caddy address must be contained by the app subnet")
          if caddy_address in dynamic_range:
              raise SystemExit("the Caddy address must be outside the dynamic address range")
          if trusted_proxy != str(caddy_address):
              raise SystemExit("the backend trusted proxy must match the Caddy address")
          PY
      - name: Build deployment images
        run: docker compose --profile tools build
      - name: Start deployment topology
        run: docker compose up --detach --wait --wait-timeout 240
      - name: Verify same-origin routing and readiness
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors http://127.0.0.1:18000/health/ready
          curl --fail --silent --show-error --retry 10 --retry-all-errors http://127.0.0.1:18000/api/settings
          curl --fail --silent --show-error --retry 10 --retry-all-errors http://127.0.0.1:18000/ > /dev/null
          metrics_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/internal/metrics)"
          if [ "$metrics_status" != "404" ]; then
            echo "internal metrics must not be exposed through Caddy (status: $metrics_status)"
            exit 1
          fi
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable deployment
        if: always()
        run: docker compose down --volumes --remove-orphans

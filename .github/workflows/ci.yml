name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/tests/requirements.txt
      - run: python -m unittest discover -s deploy/tests -v

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test quality checks
        run: node --test ../tools/quality/*.test.mjs
      - run: npm run lint
      - run: npm run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 30
      - run: npm run build

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_DSN: host=127.0.0.1 user=postgres password=postgres dbname=blog_db_test port=5432 sslmode=disable TimeZone=UTC
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          source /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Prepare isolated test database and apply migrations
        run: go run ./cmd/testsetup --migrate-only
      - name: Test with complete backend coverage
        run: |
          set -o pipefail
          go test -race -p 1 -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out -json ./... | tee test-results.json
      - name: Generate backend coverage reports
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out > coverage-summary.txt
            go tool cover -html=coverage.out -o coverage.html
          fi
      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
            backend/coverage-summary.txt
            backend/test-results.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce backend coverage
        run: node ../tools/quality/coverage.mjs backend .
      - run: go vet ./...
      - name: Record isolated query plans
        env:
          QUERY_ANALYSIS_OUTPUT: ${{ runner.temp }}/query-analysis.json
          SEARCH_QUERY_ANALYSIS_OUTPUT: ${{ runner.temp }}/search-query-analysis.json
        run: go test -run '^Test(QueryAnalysis|SearchQueryPlans)$' -count=1 -v ./internal/routes
      - name: Upload query plans
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: query-analysis
          path: |
            ${{ runner.temp }}/query-analysis.json
            ${{ runner.temp }}/search-query-analysis.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record anonymous public read benchmark
        run: |
          set -o pipefail
          go test -run '^$' -bench '^BenchmarkAnonymousPublicReads$' -benchmem -benchtime=200ms -count=1 ./internal/routes | tee "$RUNNER_TEMP/public-read-benchmark.txt"
          go test -run '^$' -bench '^BenchmarkAnonymousLongBodyReads$' -benchmem -benchtime=200ms -count=1 ./internal/routes | tee "$RUNNER_TEMP/long-body-read-benchmark.txt"
      - name: Upload public read benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-read-benchmark
          path: |
            ${{ runner.temp }}/public-read-benchmark.txt
            ${{ runner.temp }}/long-body-read-benchmark.txt
          retention-days: 30
      - run: go build ./...

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_DSN: host=127.0.0.1 user=postgres password=postgres dbname=blog_db_test port=5432 sslmode=disable TimeZone=UTC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Upload Playwright and accessibility reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  containers:
    runs-on: ubuntu-24.04
    env:
      SITE_ADDRESS: :80
      SITE_ORIGIN: http://127.0.0.1:18000
      APP_IMAGE_TAG: ci
      APP_NETWORK_SUBNET: 172.30.0.0/24
      APP_NETWORK_IP_RANGE: 172.30.0.128/25
      CADDY_TRUSTED_IP: 172.30.0.2
      HTTP_PORT: "18000"
      HTTPS_PORT: "18443"
    steps:
      - uses: actions/checkout@v5
      - name: Prepare disposable Compose secrets
        run: |
          mkdir -p deploy/secrets deploy/backups
          printf '%s' 'ci-postgres-password' > deploy/secrets/postgres_password
          printf '%s' 'ci-jwt-secret-with-at-least-thirty-two-bytes' > deploy/secrets/jwt_secret
          printf '%s' 'ci-admin-password-strong-value' > deploy/secrets/admin_password
      - name: Validate Compose configuration
        run: |
          docker compose --profile tools config --quiet
          docker compose --profile tools config --format json > "$RUNNER_TEMP/compose-config.json"
          python3 - "$RUNNER_TEMP/compose-config.json" <<'PY'
          import ipaddress
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as config_file:
              config = json.load(config_file)

          network_config = config["networks"]["app"]["ipam"]["config"]
          if len(network_config) != 1:
              raise SystemExit("the app network must define exactly one IPAM range")

          subnet = ipaddress.ip_network(network_config[0]["subnet"])
          dynamic_range = ipaddress.ip_network(network_config[0]["ip_range"])
          caddy_address = ipaddress.ip_address(
              config["services"]["caddy"]["networks"]["app"]["ipv4_address"]
          )
          trusted_proxy = config["services"]["backend"]["environment"]["TRUSTED_PROXIES"]

          if not dynamic_range.subnet_of(subnet):
              raise SystemExit("the dynamic address range must be contained by the app subnet")
          if caddy_address not in subnet:
              raise SystemExit("the Caddy address must be contained by the app subnet")
          if caddy_address in dynamic_range:
              raise SystemExit("the Caddy address must be outside the dynamic address range")
          if trusted_proxy != str(caddy_address):
              raise SystemExit("the backend trusted proxy must match the Caddy address")
          PY
      - name: Build deployment images
        run: docker compose --profile tools build
      - name: Start deployment topology
        run: docker compose up --detach --wait --wait-timeout 240
      - name: Verify same-origin routing and readiness
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors http://127.0.0.1:18000/health/ready
          curl --fail --silent --show-error --retry 10 --retry-all-errors http://127.0.0.1:18000/api/settings
          curl --fail --silent --show-error --retry 10 --retry-all-errors http://127.0.0.1:18000/ > /dev/null
          metrics_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/internal/metrics)"
          if [ "$metrics_status" != "404" ]; then
            echo "internal metrics must not be exposed through Caddy (status: $metrics_status)"
            exit 1
          fi
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable deployment
        if: always()
        run: docker compose down --volumes --remove-orphans


  publish-images:
    needs: [frontend, backend, e2e, containers, deployment-tests]
    if: >-
      vars.ENABLE_VPS_DEPLOY == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == (vars.DEPLOY_BRANCH || 'main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            target: runtime
          - service: backend
            context: ./backend
            target: runtime
          - service: maintenance
            context: ./backend
            target: maintenance
    steps:
      - uses: actions/checkout@v5
      - name: Select image name and platform
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          PLATFORM: ${{ vars.VPS_PLATFORM || 'linux/amd64' }}
        run: |
          case "$PLATFORM" in linux/amd64|linux/arm64) ;; *) exit 1 ;; esac
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: ${{ steps.image.outputs.platform }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ matrix.service }}-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.image.outputs.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ steps.image.outputs.platform }}
      - name: Record immutable image reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['SERVICE'] + '.json').write_text(json.dumps({'image': os.environ['IMAGE']}))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: deploy-image-${{ matrix.service }}
          path: ${{ matrix.service }}.json
          retention-days: 14
